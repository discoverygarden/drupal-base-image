; Disable session upload progress tracking.
;
; Mitigates CVE-2026-115560 (and the PHP2Shell CVE-2026-109619 vector) per the
; PHP security advisory of 2026-10-23. Drupal does not use this feature (its
; upload progress indicator relies on the uploadprogress extension instead).
;
; Kept in its own file so it is not clobbered when the drupal helm chart mounts
; its own 99-config.ini over the image's copy (phpCreateIni: true).
;
; https://www.php.net/manual/en/session.configuration.php#ini.session.upload-progress.enabled
session.upload_progress.enabled = 0
